[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onegallery"
version = "0.4.0"
description = "A One UI-style photo gallery for Linux / KDE Plasma"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PySide6>=6.6", "Pillow>=10.0", "cryptography>=41"]

[project.optional-dependencies]
heif = ["pillow-heif>=0.16"]
live = ["watchdog>=4.0"]
trash = ["send2trash>=1.8"]
people = ["opencv-python-headless>=4.8", "numpy"]
all = ["pillow-heif>=0.16", "watchdog>=4.0", "send2trash>=1.8", "opencv-python-headless>=4.8", "numpy"]

[project.scripts]
onegallery = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["backend"]
