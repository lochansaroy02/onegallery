# Build the Windows installer (OneGallery-<version>-setup.exe) on GitHub's Windows machines.
#
# - Push a tag like v0.3.0: builds and attaches the installer to that GitHub release.
# - Actions tab > "Windows build" > Run workflow: builds and keeps the installer as a
#   downloadable artifact of the run (no release).
name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # attach the installer to the release

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      # informational: a Windows-only test failure should not block the installer;
      # the packaged app's --self-test in build.ps1 is the real gate
      - name: Unit tests
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 8   # a hanging test must not hold up the build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --quiet -r requirements.txt send2trash watchdog pillow-heif
          python -m unittest discover -s tests -v

      - name: Build app and installer
        shell: pwsh
        timeout-minutes: 40
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\build.ps1 -SkipTests

      - uses: actions/upload-artifact@v4
        with:
          name: OneGallery-windows
          path: |
            dist/OneGallery-*-setup.exe
            build/self-test.txt
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OneGallery-*-setup.exe
